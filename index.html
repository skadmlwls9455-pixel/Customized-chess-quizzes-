<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Mistake Notes · 체스 오답노트</title>
<meta name="author" content="Katherine Nahm">
<meta name="description" content="Turn the turning points of your lost Chess.com games into puzzles. 내가 진 판으로 만드는 오답 퍼즐.">
<meta name="theme-color" content="#302e2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
  <div class="logo"><i id="logoIc"></i><span data-i18n="app">체스 오답노트</span></div>
  <div class="tabs hidden" id="tabs">
    <button data-tab="puzzle" class="on" data-i18n="tab.puzzle">퍼즐</button>
    <button data-tab="report" data-i18n="tab.report">리포트</button>
    <button data-tab="home" data-i18n="tab.home">다른 아이디</button>
  </div>
</div>

<!-- landing -->
<section class="landing" id="landing">
  <h1 data-i18n-html="hero"></h1>
  <p class="lead" data-i18n="lead"></p>
  <div class="box">
    <form class="field" id="form">
      <input id="user" data-i18n-ph="ph.user" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button class="btn green start" type="submit" data-i18n="btn.start">시작</button>
    </form>
    <div class="opts">
      <label><span data-i18n="opt.losses"></span> <select id="nLoss"><option>20</option><option selected>30</option><option>50</option></select><span data-i18n="opt.count"></span></label>
      <label><input type="checkbox" value="rapid" class="tc" checked><span data-i18n="tc.rapid"></span></label>
      <label><input type="checkbox" value="blitz" class="tc" checked><span data-i18n="tc.blitz"></span></label>
      <label><input type="checkbox" value="bullet" class="tc"><span data-i18n="tc.bullet"></span></label>
      <label><input type="checkbox" value="daily" class="tc"><span data-i18n="tc.daily"></span></label>
      <label><span data-i18n="opt.quality"></span> <select id="quality"><option value="fast" data-i18n="q.fast"></option><option value="normal" selected data-i18n="q.normal"></option><option value="deep" data-i18n="q.deep"></option></select></label>
    </div>
    <div class="err" id="err"></div>
    <div class="saved" id="saved"></div>
    <div class="small">
      <span data-i18n="note.privacy"></span><br>
      <span data-i18n="note.pgn"></span>
      <label class="pgnpick"><span data-i18n="pgn.pick"></span><input type="file" id="pgnFile" accept=".pgn,.txt" hidden></label>
    </div>
  </div>
</section>

<!-- progress -->
<section class="prog hidden" id="progress">
  <h2 id="progTitle"></h2>
  <div class="bar"><div id="progBar"></div></div>
  <div class="sub" id="progSub"></div>
  <div class="small" data-i18n="prog.screen"></div>
  <button class="btn cancel" id="cancelBtn" data-i18n="prog.cancel"></button>
</section>

<!-- puzzles -->
<div class="app hidden" id="puzzleView">
  <div class="bcol">
    <div class="player"><div class="av" id="oppAv"></div><span class="nm" id="oppName"></span></div>
    <div class="boardwrap">
      <div class="board" id="board"></div>
      <div class="promo" id="promo"></div>
    </div>
    <div class="player"><div class="av" id="meAv"></div><span class="nm" id="meName"></span></div>
  </div>
  <div class="side">
    <div class="panel">
      <div class="ptop" id="ptop"><div class="ic" id="pic"></div><div id="ptxt"></div></div>
      <div class="pbody">
        <div class="meta"><span id="meta"></span><a id="glink" href="#" target="_blank" rel="noopener" data-i18n="game.link"></a></div>
        <div class="tags" id="tags"></div>
        <div class="msg" id="msg"></div>
        <div class="explain" id="explain"></div>
        <div class="btnrow">
          <button class="btn sm" id="hintBtn" data-i18n="btn.hint"></button>
          <button class="btn sm" id="showBtn" data-i18n="btn.show"></button>
          <button class="btn sm" id="playedBtn" data-i18n="btn.played"></button>
        </div>
        <button class="btn green" id="nextBtn" data-i18n="btn.next"></button>
      </div>
      <div class="pfoot">
        <button id="prevBtn" data-i18n="btn.prev"></button>
        <span id="count"></span>
        <button id="retryBtn" data-i18n="btn.retry"></button>
      </div>
    </div>
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="sDone">0</b><span data-i18n="stat.done"></span></div>
        <div class="stat"><b id="sClean">0</b><span data-i18n="stat.clean"></span></div>
        <div class="stat"><b id="sHabit">0</b><span data-i18n="stat.habit"></span></div>
      </div>
    </div>
    <div class="card">
      <h3 data-i18n="side.filters"></h3>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
      <div class="credit" data-i18n="side.legend"></div>
    </div>
  </div>
</div>

<!-- report -->
<section class="report hidden" id="reportView"></section>

<footer class="foot">
  <div class="langs"><button data-lang="ko">한국어</button> · <button data-lang="en">English</button></div>
  © 2026 Katherine Nahm · <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener">GPLv3</a> · <a href="https://github.com/skadmlwls9455-pixel/customized-chess-quizzes-" target="_blank" rel="noopener">Source</a> · Engine: Stockfish · Pieces: cburnett (CC BY-SA 3.0)
</footer>

<script type="module" src="src/app.js"></script>
</body>
</html>
